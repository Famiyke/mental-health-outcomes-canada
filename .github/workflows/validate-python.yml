name: Validate portfolio Python workflow
on:
  push:
    paths:
      - '**.py'
      - '.github/workflows/validate-python.yml'
  workflow_dispatch:
jobs:
  demo-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy openpyxl
      - name: Compile Python files
        run: python -m compileall -q .
      - name: Generate and analyze demonstration data
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f simulate_cihi_data.py ]]; then
            python simulate_cihi_data.py
            python 01_clean_explore.py
            python 02_analysis.py
          elif [[ -f simulate_ccdss_data.py ]]; then
            python simulate_ccdss_data.py
            python 01_clean_explore.py
            python 02_analysis.py
          elif [[ -f simulate_nhex_data.py ]]; then
            python simulate_nhex_data.py
            python analysis.py
          elif [[ -f simulate_waittimes.py ]]; then
            python simulate_waittimes.py
            python analysis.py
          elif [[ -f simulate_cchs.py ]]; then
            python simulate_cchs.py
            python analysis.py
          elif [[ -f simulate_manitoba.py ]]; then
            python simulate_manitoba.py
            python analysis.py
          else
            echo "No supported demo entry point" >&2
            exit 1
          fi

      - name: Validate dashboard containers and Excel workbooks
        shell: bash
        run: |
          python - <<'PY'
          import glob, zipfile
          from openpyxl import load_workbook
          for path in glob.glob('*.pbix') + glob.glob('*.xlsx'):
              assert zipfile.is_zipfile(path), f'Not a valid archive: {path}'
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None, f'Corrupt member in {path}'
                  print(f'{path}: {len(archive.namelist())} archive entries')
              if path.endswith('.xlsx'):
                  wb = load_workbook(path, read_only=True, data_only=True)
                  assert wb.sheetnames, f'No worksheets in {path}'
                  for ws in wb.worksheets:
                      print(f'  {ws.title}: {ws.max_row} rows x {ws.max_column} cols')
                  wb.close()
          PY
