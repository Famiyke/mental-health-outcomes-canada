name: Collect published dashboard screenshots for QA
on:
  push:
    paths:
      - '.github/workflows/collect-dashboard-previews.yml'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: mental-health-report-previews
          path: screenshot_page*.png.png
